# ===== Base de données H2 en mémoire pour les tests =====
spring.datasource.url=jdbc:h2:mem:eventpro_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Console H2 (optionnelle, utile en debug local) =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Désactiver les services externes pendant les tests =====
spring.devtools.restart.enabled=false